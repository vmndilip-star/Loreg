[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loreg"
version = "0.1.0"
description = "AI assistant for small electronics and appliance shops: finds dead stock and launch risk."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "openai>=1.40",
    "python-dotenv",
    "pyyaml",
    "python-multipart",
    "feedparser",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

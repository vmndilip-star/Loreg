# Loreg product-line table. One entry per product LINE; variants expand into SKUs.
#
# Phase A draft: awaiting approval. Nothing here has been verified against a catalogue.
#   - Names are real brand and product-line names written from memory. Model numbers are
#     never invented. Appliance lines use descriptive names (brand + type) on purpose.
#   - name_verified is false on every line. See data/names_to_verify.csv.
#   - name_confidence is my own estimate (high|medium|low) that the line exists as named
#     in that release year. Variant lists (sizes, storage, colors, capacities) are the
#     part most likely to contain errors.
#   - Variant count per line = product of its dimension lengths.
#   - launch_family marks the Samsung 2024 TV lines used for the launch-risk demo.
# Prices, costs, quantities and sales are NOT in this file; they are generated later.
